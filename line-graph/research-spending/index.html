<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Task 1 – US government research spending</title>
<style>
:root{--bg:#f2f4f8;--card:#fff;--tx:#1b2230;--mut:#5b6575;--bd:#d9dee7;--ac:#2b59c3;--bad:#c43a2b;--c1:#2b59c3;--c2:#2a8a57;--c3:#d27a1f;--c4:#c99a06;--c5:#1b2230;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161c;--card:#1c212b;--tx:#e8ebf2;--mut:#9aa3b2;--bd:#333b49;--ac:#7aa2ff;--bad:#ff7b6b;--c1:#6c9bff;--c2:#52c486;--c3:#f0a04b;--c4:#f2c94c;--c5:#e8ebf2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13161c;--card:#1c212b;--tx:#e8ebf2;--mut:#9aa3b2;--bd:#333b49;--ac:#7aa2ff;--bad:#ff7b6b;--c1:#6c9bff;--c2:#52c486;--c3:#f0a04b;--c4:#f2c94c;--c5:#e8ebf2;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.25rem;margin:0 0 4px;line-height:1.3}
.task{color:var(--mut);margin:0 0 14px;font-size:.92rem}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:1 0 auto;padding:9px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;font-size:.9rem;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.leg,.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.leg button,.chip,.tools .b{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;font:inherit;font-size:.88rem;cursor:pointer}
.leg button.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.leg button.off{opacity:.4}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1 1 100%}.gl{font-size:.8rem;color:var(--mut);min-width:64px}
.tools .b{border-radius:8px}
svg{width:100%;height:auto;display:block}
.ax{font:12px system-ui,sans-serif;fill:var(--mut)}
.val{font:600 13px system-ui,sans-serif;paint-order:stroke;stroke:var(--card);stroke-width:4px}
.info{margin-top:12px;font-size:.95rem}.info p{margin:0 0 8px}.mut{color:var(--mut)}
.info ul{margin:4px 0 0;padding-left:20px}
.bad{color:var(--bad)}
.note{color:var(--mut);font-size:.8rem;margin-top:10px}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body><main>
<h1>U.S. government spending on research, 1980–2008</h1>
<p class="task">The graph below gives information about U.S. government spending on research between 1980 and 2008. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.</p>
<div class="tabs" id="tabs"></div>
<div class="box">
<div class="leg" id="leg"></div><div class="tools" id="tools"></div>
<svg id="c" viewBox="0 0 720 420" role="img" aria-label="Line graph: U.S. government spending on research in five areas, 1980 to 2008"></svg>
<div class="info" id="info"></div>
</div>
<p class="note">Số liệu được đọc xấp xỉ từ hình đề bài.</p>
</main>
<script>
const $=s=>document.querySelector(s),svg=$('#c'),Y=[1980,1984,1988,1992,1996,2000,2004,2008];
const S=[{n:'Health',v:[8,7,10,13,15,16.5,22,18],c:'var(--c1)',m:'o',d:''},
{n:'Space',v:[6,5,5.2,5.8,7.5,7.8,8,9.3],c:'var(--c3)',m:'s',d:''},
{n:'Energy',v:[5,5.1,5,5.2,8,5.1,5.2,7.5],c:'var(--c2)',m:'t',d:''},
{n:'General Science',v:[2.6,2.7,3.8,2.9,3.5,5,5.1,5.2],c:'var(--c4)',m:'d',d:''},
{n:'Other',v:[7.5,5,5.2,6.5,7.6,8,7.3,5.2],c:'var(--c5)',m:'x',d:''}];
const DX=570/(Y.length-1),X=i=>90+i*DX,Yp=v=>370-v*14,N=S.length,M=Y.length-1;
let mode=1,vis=S.map(()=>1),hov=-1,TXT='',L={},msg='';
const CR={};
for(let a=0;a<N;a++)for(let b=a+1;b<N;b++)for(let i=0;i<M;i++){const A=S[a].v,B=S[b].v,d0=A[i]-B[i],d1=A[i+1]-B[i+1];if(d0*d1<0){const t=d0/(d0-d1);CR[a+'-'+b+'-'+i]={x:X(i+t),y:Yp(A[i]+(A[i+1]-A[i])*t)}}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FS={increase:/increas|\bris|rose|grow|grew|climb|soar|surge|rocket|recover|rebound|jump|go up|went up/i,decrease:/decreas|fall|fell|drop|declin|dip|plummet|plunge|go down|went down/i,'level off':/level|stable|plateau|unchang|steady|constant|remain|flat|fluctuat|vary|varied|hover|maintain|stay/i};
const FP={peak:/peak|highest|maximum|\bmax\b|\btop\b|summit/i,'lowest point':/\blow(est)?\b|minimum|\bmin\b|trough|bottom/i};
const fam=(t,F)=>Object.keys(F).find(k=>F[k].test(t))||null;
const kind=w=>/intersect|cross|meet|overtake|overtook|equal/i.test(w)?'x':/turn|revers/i.test(w)?'t':fam(w,FP)?'p':fam(w,FS)?'g':null;
function mk(m,x,y,c){const r=7;
if(m=='o')return `<circle cx="${x}" cy="${y}" r="${r}" fill="var(--card)" stroke="${c}" stroke-width="2.5"/>`;
if(m=='s')return `<rect x="${x-r+1}" y="${y-r+1}" width="${2*r-2}" height="${2*r-2}" fill="${c}"/>`;
if(m=='t')return `<path d="M${x} ${y-r-1}L${x+r+1} ${y+r}L${x-r-1} ${y+r}Z" fill="var(--card)" stroke="${c}" stroke-width="2.5"/>`;
if(m=='x')return `<path d="M${x-6} ${y-6}L${x+6} ${y+6}M${x+6} ${y-6}L${x-6} ${y+6}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`;
return `<path d="M${x} ${y-r-1}L${x+r+1} ${y}L${x} ${y+r+1}L${x-r-1} ${y}Z" fill="${c}"/>`}
function render(){let h='',cnt={};
for(let v=0;v<=25;v+=5)h+=`<line x1="60" x2="690" y1="${Yp(v)}" y2="${Yp(v)}" stroke="var(--bd)"/><text x="50" y="${Yp(v)+4}" text-anchor="end" class="ax">${v}</text>`;
Y.forEach((y,i)=>h+=`<text x="${X(i)}" y="392" text-anchor="middle" class="ax">${y}</text>`);
h+=`<text x="375" y="414" text-anchor="middle" class="ax">Year</text><text transform="translate(14 195) rotate(-90)" text-anchor="middle" class="ax">Expenditure ($ billions)</text>`;
S.forEach((s,k)=>{if(!vis[k])return;const v=s.v;
h+=`<polyline fill="none" stroke="${s.c}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${s.d}" points="${v.map((a,i)=>X(i)+','+Yp(a)).join(' ')}"/>${v.map((a,i)=>mk(s.m,X(i),Yp(a),s.c)).join('')}`});
if(mode==1&&hov>=0){h+=`<line x1="${X(hov)}" x2="${X(hov)}" y1="20" y2="370" stroke="var(--mut)" stroke-dasharray="4 4"/>`;S.forEach((s,k)=>{if(vis[k])h+=`<text x="${X(hov)+12}" y="${Yp(s.v[hov])+4}" class="val" fill="${s.c}">${s.v[hov]}</text>`})}
if(mode==2)Object.entries(L).forEach(([k,l])=>{const c=k[0],[s,i,j]=k.slice(1).split('-').map(Number);let x,y,dn=0;
if(c=='x'){if(!vis[s]||!vis[i])return;const p=CR[s+'-'+i+'-'+j];x=p.x;y=p.y}
else{if(!vis[s])return;const v=S[s].v;if(c=='g'){x=(X(i)+X(i+1))/2;y=(Yp(v[i])+Yp(v[i+1]))/2-14}else{x=X(i);y=Yp(v[i]);dn=c=='p'&&fam(l,FP)=='lowest point'}}
const col=c=='x'?'var(--ac)':S[s].c;
if(c=='x'||c=='t')h+=`<circle cx="${x}" cy="${y}" r="13" fill="none" stroke="${col}" stroke-width="3"/>`;
if(c!='g'){const n=cnt[x+','+y]=(cnt[x+','+y]??-1)+1;y+=dn?28+16*n:-22-16*n}
h+=`<text x="${x}" y="${y}" text-anchor="middle" class="val" fill="${col}">${esc(l.slice(0,32))}</text>`});
svg.innerHTML=h}
function info(){let r='';
if(mode==1){if(hov<0)r='<p class="mut">Di chuột (hoặc chạm) vào biểu đồ để xem số liệu từng năm. Bấm tên đường ở chú giải để hiện/ẩn và so sánh.</p>';
else{const a=S.map(s=>[s,s.v[hov]]).filter((_,k)=>vis[k]).sort((p,q)=>q[1]-p[1]);
r=`<p><b>${Y[hov]}</b></p><ul>${a.map(([s,v])=>`<li style="color:${s.c}"><b>${s.n}</b>: $${v}bn</li>`).join('')}</ul>`;
if(a.length==2){const d=Math.round(Math.abs(a[0][1]-a[1][1])*10)/10;r+=`<p style="margin-top:8px">${d?`In ${Y[hov]}, ${a[0][0].n} ($${a[0][1]}bn) spent <b>$${d}bn more than</b> ${a[1][0].n} ($${a[1][1]}bn).`:`In ${Y[hov]}, ${a[0][0].n} and ${a[1][0].n} spent the <b>same amount</b> ($${a[0][1]}bn).`}</p>`}}}
if(mode==2)r='<p class="mut">Tự gõ ghi chú hoặc nhãn (ví dụ: rose steadily, reached a peak, turning point, the lines intersect), hoặc bấm các từ gợi ý để ghép lại (ví dụ: rose + sharply). Sau đó bấm vào đoạn đường, điểm hoặc chỗ hai đường cắt nhau. Bấm lại cùng nội dung để bỏ. Hiện/ẩn từng đường ở chú giải để dễ thao tác; nội dung đã ghi vẫn được giữ.</p>';
if(!vis.includes(1))r+='<p class="bad">Chưa có đường nào đang hiện. Bấm tên đường ở chú giải để hiện.</p>';
$('#info').innerHTML=r+(msg?`<p class="bad">${msg}</p>`:'');msg=''}
function upd(){render();info()}
const inp=()=>`<input id="inp" type="text" autocomplete="off" placeholder="Tự viết ghi chú / nhãn tại đây..." value="${esc(TXT)}" oninput="TXT=this.value" style="flex:1 1 100%;min-width:0;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;font-size:.92rem">`;
function ui(){
$('#tabs').innerHTML=[[1,'1 · Explore the data'],[2,'2 · Key features &amp; trends']].map(([m,t])=>`<button class="${mode==m?'on':''}" onclick="setMode(${m})">${t}</button>`).join('');
$('#leg').innerHTML=S.map((s,k)=>`<button class="${vis[k]?'sel':'off'}" aria-pressed="${!!vis[k]}" onclick="lg(${k})"><svg width="36" height="16" viewBox="0 0 36 16" style="width:36px"><line x1="0" x2="36" y1="8" y2="8" stroke="${s.c}" stroke-width="3" stroke-dasharray="${s.d}"/>${mk(s.m,18,8,s.c)}</svg>${s.n}</button>`).join('')+'<button onclick="vis=S.map(()=>1);ui()">Hiện cả 5 đường</button>';
let t='';
if(mode==2){const G=(n,a)=>`<div class="grp"><span class="gl">${n}</span>${a.map(k=>`<button class="chip" onclick="add('${k}')">${k}</button>`).join('')}</div>`;
t=inp()+G('Trends',['increase','decrease','rose','grew','climbed','soared','fell','declined','dropped','plummeted','remained stable','levelled off','fluctuated','recovered','reached a peak','hit a low'])+G('Adverbs',['sharply','dramatically','significantly','considerably','rapidly','steadily','gradually','moderately','slightly','slowly','marginally'])+G('Features',['peak','lowest point','turning point','intersection','overtook'])+'<button class="b" onclick="clr()">Xóa ô nhập</button><button class="b" onclick="L={};upd()">Xóa nhãn trên biểu đồ</button>'}
$('#tools').innerHTML=t;$('#tools').style.display=t?'flex':'none';
svg.style.touchAction=mode==1?'none':'auto';upd()}
function setMode(m){mode=m;hov=-1;ui()}
function lg(k){vis[k]^=1;ui()}
function add(w){TXT=(TXT.trim()?TXT.trim()+' ':'')+w;ui()}
function clr(){TXT='';ui()}
function P(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return[q.x,q.y]}
function dseg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function hv(x){hov=Math.max(0,Math.min(M,Math.round((x-90)/DX)));upd()}
function clk(x,y){const w=TXT.trim();if(!w){msg='Hãy gõ hoặc chọn một ghi chú / nhãn trước khi bấm lên biểu đồ.';return upd()}
const t=kind(w),ks=S.map((_,k)=>k).filter(k=>vis[k]);let best=null,bd=999;
const pt=()=>ks.forEach(k=>S[k].v.forEach((a,i)=>{const d=Math.hypot(X(i)-x,Yp(a)-y);if(d<(t?24:18)&&d<bd){bd=d;best=(t||'p')+k+'-'+i}}));
const sg=()=>ks.forEach(k=>{const v=S[k].v;for(let i=0;i<M;i++){const d=dseg([x,y],[X(i),Yp(v[i])],[X(i+1),Yp(v[i+1])]);if(d<28&&d<bd){bd=d;best='g'+k+'-'+i}}});
if(t=='x')Object.entries(CR).forEach(([id,c])=>{const [a,b]=id.split('-');const d=Math.hypot(c.x-x,c.y-y);if(vis[a]&&vis[b]&&d<24&&d<bd){bd=d;best='x'+id}});
else if(t=='g')sg();else if(t)pt();else{pt();if(!best)sg()}
if(best)L[best]==w?delete L[best]:L[best]=w;upd()}
svg.addEventListener('pointerdown',e=>{const [x,y]=P(e);if(mode==1)hv(x);else clk(x,y)});
svg.addEventListener('pointermove',e=>{if(mode==1)hv(P(e)[0])});
svg.addEventListener('pointerleave',e=>{if(mode==1&&e.pointerType=='mouse'){hov=-1;upd()}});
ui();
</script></body></html>
